<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>RecruitAI - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../css/typography.css">
<style>
    body {
        font-family: 'Inter', sans-serif;
    }
    h1, h2, h3, .font-outfit {
        font-family: 'Outfit', sans-serif;
    }
    /* Custom animations for glass cards */
    .glass-card {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
    }
    /* Glow animations */
    @keyframes pulse-glow {
        0%, 100% { opacity: 0.4; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.05); }
    }
    .orb-1 { animation: pulse-glow 8s infinite alternate; }
    .orb-2 { animation: pulse-glow 10s infinite alternate-reverse; }
    .input-focus-glow:focus-within {
        box-shadow: 0 0 15px rgba(255, 255, 255, 0.15);
        border-color: rgba(255, 255, 255, 0.6);
    }
</style>
<script id="tailwind-config">
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                colors: {
                    primary: "#ffffff",
                    secondary: "#a1a1aa",
                    surface: "#09090b",
                    "surface-light": "#18181b",
                }
            }
        }
    }
</script>
<script src="../js/theme.js"></script>
</head>
<body class="bg-[#0B0F19] text-gray-200 min-h-screen flex items-center justify-center relative overflow-hidden">
    
    <!-- Background Animated Orbs (Monochrome) -->
    <div class="orb-1 absolute top-[-5%] left-[5%] w-[40vw] h-[40vw] rounded-full bg-gradient-to-br from-zinc-600/20 to-zinc-800/20 blur-[100px] z-0 pointer-events-none"></div>
    <div class="orb-2 absolute bottom-[-5%] right-[5%] w-[45vw] h-[45vw] rounded-full bg-gradient-to-tl from-zinc-700/20 to-zinc-900/20 blur-[120px] z-0 pointer-events-none"></div>
    <div class="w-full max-w-[440px] px-6 relative z-10">
        
        <div class="text-center mb-10">
            <div class="w-20 h-20 bg-gradient-to-br from-zinc-800 to-zinc-900 text-white rounded-2xl flex items-center justify-center text-4xl shadow-[0_0_30px_rgba(255, 255, 255, 0.50)] mx-auto mb-6 transform hover:scale-105 transition-transform duration-300">
                <i class="fas fa-brain"></i>
            </div>
            <h1 class="text-4xl font-bold text-white tracking-tight font-outfit mb-2">Recruit<span class="text-zinc-200">AI</span></h1>
            <p class="text-gray-400 text-sm tracking-wide uppercase font-semibold">Smart Resume Screening</p>
        </div>
        
        <!-- Login Section -->
        <div id="login-section" class="glass-card rounded-3xl p-8 transition-all duration-500 transform opacity-100">
            <h2 class="text-2xl font-bold text-white mb-2 font-outfit">Welcome Back</h2>
            <p class="text-sm text-gray-400 mb-8">Sign in to access your dashboard</p>
            
            <form aria-label="Authentication Form" action="/login" method="post" class="flex flex-col gap-5">
                <div>
                    <label for="login-email" class="block text-xs font-semibold text-gray-300 uppercase tracking-wider mb-2">Email Address</label>
                    <div class="relative input-focus-glow rounded-xl transition-all duration-300">
                        <i class="fas fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-gray-500"></i>
                        <input type="email" id="login-email" name="email" class="w-full pl-12 pr-4 py-3.5 bg-gray-900/50 border border-gray-700/50 rounded-xl text-white placeholder-gray-600 focus:outline-none focus:ring-0 transition-colors" placeholder="your@email.com" required>
                    </div>
                </div>
                <div>
                    <div class="flex items-center justify-between mb-2">
                        <label for="login-password" class="block text-xs font-semibold text-gray-300 uppercase tracking-wider">Password</label>
                        <a href="#" class="text-xs font-medium text-zinc-200 hover:text-zinc-200 transition-colors">Forgot?</a>
                    </div>
                    <div class="relative input-focus-glow rounded-xl transition-all duration-300">
                        <i class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-gray-500"></i>
                        <input type="password" id="login-password" name="password" class="w-full pl-12 pr-4 py-3.5 bg-gray-900/50 border border-gray-700/50 rounded-xl text-white placeholder-gray-600 focus:outline-none focus:ring-0 transition-colors" placeholder="••••••••" required>
                    </div>
                </div>
                
                <button type="submit" class="w-full mt-4 py-3.5 bg-gradient-to-r from-zinc-800 to-zinc-900 text-white font-bold rounded-xl shadow-[0_10px_20px_-10px_rgba(255, 255, 255, 0.60)] hover:shadow-[0_15px_25px_-10px_rgba(255, 255, 255, 0.80)] hover:-translate-y-0.5 transition-all duration-300 active:scale-95">
                    Sign In <i class="fas fa-arrow-right ml-2 text-sm"></i>
                </button>
            </form>
            
            <div class="mt-8 text-center text-sm text-gray-400">
                Don't have an account? <a href="#" onclick="switchToRegister(event)" class="text-zinc-200 font-semibold hover:text-zinc-200 hover:underline ml-1 transition-colors">Create one</a>
            </div>
        </div>
        
        <!-- Register Section -->
        <div id="register-section" class="hidden glass-card rounded-3xl p-8 transition-all duration-500 transform opacity-100">
            <h2 class="text-2xl font-bold text-white mb-2 font-outfit">Get Started</h2>
            <p class="text-sm text-gray-400 mb-8">Create your account to start screening</p>
            
            <form aria-label="Authentication Form" action="/register" method="post" class="flex flex-col gap-5">
                <div>
                    <label for="register-name" class="block text-xs font-semibold text-gray-300 uppercase tracking-wider mb-2">Full Name</label>
                    <div class="relative input-focus-glow rounded-xl transition-all duration-300">
                        <i class="fas fa-user absolute left-4 top-1/2 -translate-y-1/2 text-gray-500"></i>
                        <input type="text" id="register-name" name="name" class="w-full pl-12 pr-4 py-3.5 bg-gray-900/50 border border-gray-700/50 rounded-xl text-white placeholder-gray-600 focus:outline-none focus:ring-0 transition-colors" placeholder="John Doe" required>
                    </div>
                </div>
                <div>
                    <label for="register-email" class="block text-xs font-semibold text-gray-300 uppercase tracking-wider mb-2">Email Address</label>
                    <div class="relative input-focus-glow rounded-xl transition-all duration-300">
                        <i class="fas fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-gray-500"></i>
                        <input type="email" id="register-email" name="email" class="w-full pl-12 pr-4 py-3.5 bg-gray-900/50 border border-gray-700/50 rounded-xl text-white placeholder-gray-600 focus:outline-none focus:ring-0 transition-colors" placeholder="your@email.com" required>
                    </div>
                </div>
                <div>
                    <label for="register-password" class="block text-xs font-semibold text-gray-300 uppercase tracking-wider mb-2">Password</label>
                    <div class="relative input-focus-glow rounded-xl transition-all duration-300">
                        <i class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-gray-500"></i>
                        <input type="password" id="register-password" name="password" class="w-full pl-12 pr-4 py-3.5 bg-gray-900/50 border border-gray-700/50 rounded-xl text-white placeholder-gray-600 focus:outline-none focus:ring-0 transition-colors" placeholder="••••••••" required>
                    </div>
                </div>
                
                <button type="submit" class="w-full mt-4 py-3.5 bg-gradient-to-r from-zinc-700 to-pink-600 text-white font-bold rounded-xl shadow-[0_10px_20px_-10px_rgba(168,85,247,0.6)] hover:shadow-[0_15px_25px_-10px_rgba(168,85,247,0.8)] hover:-translate-y-0.5 transition-all duration-300 active:scale-95">
                    Create Account <i class="fas fa-user-plus ml-2 text-sm"></i>
                </button>
            </form>
            
            <div class="mt-8 text-center text-sm text-gray-400">
                Already have an account? <a href="#" onclick="switchToLogin(event)" class="text-zinc-300 font-semibold hover:text-zinc-300 hover:underline ml-1 transition-colors">Sign in</a>
            </div>
        </div>
    </div>
    
    <script>
        function animateTransition(hideId, showId) {
            const hideEl = document.getElementById(hideId);
            const showEl = document.getElementById(showId);
            
            hideEl.style.opacity = '0';
            hideEl.style.transform = 'scale(0.95)';
            
            setTimeout(() => {
                hideEl.classList.add('hidden');
                hideEl.style.opacity = '1';
                hideEl.style.transform = 'scale(1)';
                
                showEl.classList.remove('hidden');
                showEl.style.opacity = '0';
                showEl.style.transform = 'scale(1.05)';
                
                setTimeout(() => {
                    showEl.style.opacity = '1';
                    showEl.style.transform = 'scale(1)';
                }, 50);
            }, 300);
        }

        function switchToRegister(e){
            e.preventDefault();
            animateTransition('login-section', 'register-section');
            document.title = "RecruitAI - Register";
        }
        function switchToLogin(e){
            e.preventDefault();
            animateTransition('register-section', 'login-section');
            document.title = "RecruitAI - Login";
        }
    </script>
</body>
</html>
