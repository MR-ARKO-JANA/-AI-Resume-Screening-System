<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | AI Recruiter</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/typography.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0B0F19;
            color: #e5e7eb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        h1, h2, h3, .font-outfit {
            font-family: 'Outfit', sans-serif;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
        }

        /* Glow animations */
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.05); }
        }
        .orb-1 { animation: pulse-glow 8s infinite alternate; }
        .orb-2 { animation: pulse-glow 10s infinite alternate-reverse; }

        .error-code {
            font-size: 8rem;
            font-weight: 900;
            background: linear-gradient(135deg, #27272a, #18181b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.1;
            filter: drop-shadow(0 10px 20px rgba(255, 255, 255, 0.40));
        }

        @media (min-width: 768px) {
            .error-code {
                font-size: 12rem;
            }
        }
    </style>
<script src="../js/theme.js"></script>
</head>
<body>
    
    <!-- Background Animated Orbs -->
    <div class="orb-1 absolute top-[10%] left-[10%] w-[30vw] h-[30vw] rounded-full bg-gradient-to-br from-zinc-700/20 to-zinc-800/20 blur-[100px] z-0 pointer-events-none"></div>
    <div class="orb-2 absolute bottom-[10%] right-[10%] w-[35vw] h-[35vw] rounded-full bg-gradient-to-tl from-pink-500/20 to-zinc-800/20 blur-[120px] z-0 pointer-events-none"></div>

    <div class="container mx-auto px-6 relative z-10 text-center max-w-2xl">
        <div class="glass-card rounded-3xl p-10 md:p-16 transform transition-transform duration-500 hover:scale-[1.02]">
            <div class="error-code font-outfit mb-2">404</div>
            <h2 class="text-3xl md:text-4xl font-bold text-white font-outfit mb-4">Page Not Found</h2>
            <p class="text-gray-400 text-lg mb-10 max-w-md mx-auto">The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
            
            <a href="/dashboard" class="inline-flex items-center justify-center gap-3 px-8 py-4 bg-gradient-to-r from-zinc-800 to-zinc-900 text-white font-bold rounded-xl shadow-[0_10px_20px_-10px_rgba(255, 255, 255, 0.60)] hover:shadow-[0_15px_25px_-10px_rgba(255, 255, 255, 0.80)] hover:-translate-y-1 transition-all duration-300">
                <i class="fas fa-home"></i> Back to Dashboard
            </a>
        </div>
    </div>

</body>
</html>
