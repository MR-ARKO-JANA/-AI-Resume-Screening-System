<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>RecruitAI - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@450&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
</style>
<script id="tailwind-config">
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                "colors": {
                    "surface-container-lowest": "#ffffff",
                    "surface": "#fcf8fa",
                    "primary": "#000000",
                    "on-surface-variant": "#45464d",
                    "border-subtle": "#E2E8F0",
                    "surface-variant": "#e4e2e4"
                },
                "fontFamily": {
                    "body-md": ["Inter"]
                }
            }
        }
    }
</script>
</head>
<body class="bg-[#F8FAFC] text-slate-800 font-body-md min-h-screen flex items-center justify-center relative overflow-hidden">
    
    <!-- Background Elements -->
    <div class="absolute top-0 left-0 w-full h-full bg-gradient-to-br from-blue-50 to-purple-50 z-0"></div>
    <div class="absolute top-[-10%] right-[-5%] w-[40vw] h-[40vw] rounded-full bg-gradient-to-bl from-[#2563EB]/10 to-[#7C3AED]/10 blur-3xl z-0 pointer-events-none"></div>
    <div class="absolute bottom-[-10%] left-[-5%] w-[40vw] h-[40vw] rounded-full bg-gradient-to-tr from-[#2563EB]/10 to-[#7C3AED]/10 blur-3xl z-0 pointer-events-none"></div>

    <div class="w-full max-w-[440px] px-6 relative z-10">
        
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-gradient-to-br from-[#2563EB] to-[#7C3AED] text-white rounded-2xl flex items-center justify-center text-3xl shadow-lg mx-auto mb-4">
                <i class="fas fa-robot"></i>
            </div>
            <h1 class="text-3xl font-bold text-primary tracking-tight">RecruitAI</h1>
            <p class="text-on-surface-variant mt-2 font-semibold">Smart Resume Screening Platform</p>
        </div>
        
        <!-- Login Section -->
        <div id="login-section" class="bg-surface-container-lowest rounded-2xl shadow-xl border border-white/50 backdrop-blur-sm p-8 transition-all duration-300 transform scale-100 opacity-100">
            <h2 class="text-2xl font-bold text-primary mb-1">Welcome Back</h2>
            <p class="text-sm text-on-surface-variant mb-6">Sign in to continue screening</p>
            
            <form aria-label="Authentication Form" action="/login" method="post" class="flex flex-col gap-4">
                <div>
                    <label for="login-email" class="block text-sm font-semibold text-primary mb-1.5">Email Address</label>
                    <div class="relative">
                        <i class="fas fa-envelope absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="email" id="login-email" name="email" class="w-full pl-10 pr-4 py-2.5 border border-border-subtle rounded-lg focus:border-[#2563EB] focus:ring-1 focus:ring-[#2563EB] outline-none bg-surface transition-colors" placeholder="your@email.com" required>
                    </div>
                </div>
                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label for="login-password" class="block text-sm font-semibold text-primary">Password</label>
                        <a href="#" class="text-xs font-semibold text-[#2563EB] hover:underline">Forgot?</a>
                    </div>
                    <div class="relative">
                        <i class="fas fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="password" id="login-password" name="password" class="w-full pl-10 pr-4 py-2.5 border border-border-subtle rounded-lg focus:border-[#2563EB] focus:ring-1 focus:ring-[#2563EB] outline-none bg-surface transition-colors" placeholder="••••••••" required>
                    </div>
                </div>
                
                <button type="submit" class="w-full mt-2 py-3 bg-[#2563EB] text-white font-bold rounded-lg shadow hover:bg-blue-700 hover:shadow-lg transition-all active:scale-[0.98]">
                    Sign In
                </button>
            </form>
            
            <div class="mt-6 text-center text-sm font-semibold text-on-surface-variant">
                Don't have an account? <a href="#" onclick="switchToRegister(event)" class="text-[#2563EB] hover:underline ml-1">Create one</a>
            </div>
        </div>
        
        <!-- Register Section -->
        <div id="register-section" class="hidden bg-surface-container-lowest rounded-2xl shadow-xl border border-white/50 backdrop-blur-sm p-8 transition-all duration-300">
            <h2 class="text-2xl font-bold text-primary mb-1">Get Started</h2>
            <p class="text-sm text-on-surface-variant mb-6">Create your account to start screening</p>
            
            <form aria-label="Authentication Form" action="/register" method="post" class="flex flex-col gap-4">
                <div>
                    <label for="register-name" class="block text-sm font-semibold text-primary mb-1.5">Full Name</label>
                    <div class="relative">
                        <i class="fas fa-user absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="text" id="register-name" name="name" class="w-full pl-10 pr-4 py-2.5 border border-border-subtle rounded-lg focus:border-[#2563EB] focus:ring-1 focus:ring-[#2563EB] outline-none bg-surface transition-colors" placeholder="John Doe" required>
                    </div>
                </div>
                <div>
                    <label for="register-email" class="block text-sm font-semibold text-primary mb-1.5">Email Address</label>
                    <div class="relative">
                        <i class="fas fa-envelope absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="email" id="register-email" name="email" class="w-full pl-10 pr-4 py-2.5 border border-border-subtle rounded-lg focus:border-[#2563EB] focus:ring-1 focus:ring-[#2563EB] outline-none bg-surface transition-colors" placeholder="your@email.com" required>
                    </div>
                </div>
                <div>
                    <label for="register-password" class="block text-sm font-semibold text-primary mb-1.5">Password</label>
                    <div class="relative">
                        <i class="fas fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="password" id="register-password" name="password" class="w-full pl-10 pr-4 py-2.5 border border-border-subtle rounded-lg focus:border-[#2563EB] focus:ring-1 focus:ring-[#2563EB] outline-none bg-surface transition-colors" placeholder="••••••••" required>
                    </div>
                </div>
                
                <button type="submit" class="w-full mt-2 py-3 bg-gradient-to-r from-[#2563EB] to-[#7C3AED] text-white font-bold rounded-lg shadow hover:opacity-95 hover:shadow-lg transition-all active:scale-[0.98]">
                    Create Account
                </button>
            </form>
            
            <div class="mt-6 text-center text-sm font-semibold text-on-surface-variant">
                Already have an account? <a href="#" onclick="switchToLogin(event)" class="text-[#2563EB] hover:underline ml-1">Sign in</a>
            </div>
        </div>
    </div>
    
    <script>
        function switchToRegister(e){
            e.preventDefault();
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('register-section').classList.remove('hidden');
            document.title = "RecruitAI - Register";
        }
        function switchToLogin(e){
            e.preventDefault();
            document.getElementById('register-section').classList.add('hidden');
            document.getElementById('login-section').classList.remove('hidden');
            document.title = "RecruitAI - Login";
        }
    </script>
</body>
</html>
